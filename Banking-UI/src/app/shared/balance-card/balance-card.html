<div class="balance-card">
  <div class="acc-label">{{ accountLabel }}</div>
  <div class="balance">{{ displayBalance }}</div>
  <div class="balance-sub">
    Available balance
    <button class="balance-toggle-btn" (click)="toggle()" [title]="isHidden ? 'Show balance' : 'Hide balance'">
      @if (!isHidden) {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3l18 18"/>
          <path d="M10.6 5.2A9.9 9.9 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.6 4.4M6.6 6.6C4 8.3 2 12 2 12s3.6 7 10 7c1.3 0 2.5-.2 3.6-.6"/>
          <path d="M9.5 9.6a3 3 0 0 0 4.2 4.2"/>
        </svg>
      }
    </button>
  </div>
</div>
