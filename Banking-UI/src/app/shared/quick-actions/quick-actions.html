<div class="quick-actions">
  @for (a of actions; track a.label) {
    <button
      [routerLink]="a.disabled ? null : a.routerLink"
      [disabled]="a.disabled"
      [title]="a.disabled ? 'Coming soon' : ''">
      <div class="qa-icon">
        @if (a.icon === 'send') {
          <svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        }
        @if (a.icon === 'list') {
          <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
        }
        @if (a.icon === 'briefcase') {
          <svg viewBox="0 0 24 24"><rect x="3" y="7.5" width="18" height="12" rx="2"/><path d="M8 7.5V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1.5"/><path d="M3 12.5h18"/></svg>
        }
        @if (a.icon === 'repeat') {
          <svg viewBox="0 0 24 24"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg>
        }
      </div>
      <span>{{ a.label }}</span>
    </button>
  }
</div>
